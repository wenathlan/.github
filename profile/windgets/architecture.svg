<svg xmlns="http://www.w3.org/2000/svg" width="820" height="140" viewBox="0 0 820 140" role="img" aria-label="Architecture">
  <rect x="0.5" y="0.5" width="819" height="139" fill="#ffffff" stroke="#e8e4df"/>
  <rect x="0" y="0" width="4" height="140" fill="#e8521c"/>
  
  <text x="18" y="25" font-family="'Inter','Helvetica Neue','Segoe UI',system-ui,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#16130f">ARCHITECTURE</text>
  <g font-family="'Inter','Helvetica Neue','Segoe UI',system-ui,Arial,sans-serif">
    <g transform="translate(24 58)"><text x="0" y="7" font-size="12.5" font-weight="800" fill="#16130f">OPEN BY DEFAULT</text><text x="0" y="26" font-size="10.5" font-weight="500" fill="#5b5752">Source-first. We share</text><text x="0" y="40" font-size="10.5" font-weight="500" fill="#5b5752">what we build.</text></g>
    <g transform="translate(230 58)"><text x="0" y="7" font-size="12.5" font-weight="800" fill="#16130f">SYSTEMS &gt; FEATURES</text><text x="0" y="26" font-size="10.5" font-weight="500" fill="#5b5752">Durable foundations</text><text x="0" y="40" font-size="10.5" font-weight="500" fill="#5b5752">over quick wins.</text></g>
    <g transform="translate(436 58)"><text x="0" y="7" font-size="12.5" font-weight="800" fill="#16130f">SHIP SMALL</text><text x="0" y="26" font-size="10.5" font-weight="500" fill="#5b5752">Frequent, reversible,</text><text x="0" y="40" font-size="10.5" font-weight="500" fill="#5b5752">real releases.</text></g>
    <g transform="translate(642 58)"><text x="0" y="7" font-size="12.5" font-weight="800" fill="#16130f">DESIGN = ENGINEERING</text><text x="0" y="26" font-size="10.5" font-weight="500" fill="#5b5752">Aesthetics and arch</text><text x="0" y="40" font-size="10.5" font-weight="500" fill="#5b5752">are one discipline.</text></g>
  </g>
</svg>
