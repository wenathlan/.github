<svg xmlns="http://www.w3.org/2000/svg" width="400" height="236" viewBox="0 0 400 236" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="hC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#d4430c"/></linearGradient>
    <linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#d4430c"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <filter id="shC" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5a2a00" flood-opacity="0.10"/></filter>
    <clipPath id="cc"><rect x="6" y="6" width="388" height="224" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cc)">
    <rect x="6" y="6" width="388" height="224" rx="18" fill="#ffffff" stroke="#eee2db" filter="url(#shC)"/>
    <rect x="6" y="6" width="6" height="224" rx="3" fill="url(#hC)"/>
    <g transform="translate(30 28)">
      <rect x="0" y="-2" width="120" height="30" rx="15" fill="url(#hC)"/>
      <text x="16" y="18" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">CONNECT</text>
    </g>
    <text x="30" y="80" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" fill="#475467">Reach out — let's build something.</text>

    <!-- icon chips 2x3 -->
    <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">
      <!-- GitHub -->
      <g transform="translate(30 100)">
        <rect x="0" y="0" width="42" height="42" rx="12" fill="url(#gG)"/>
        <g transform="translate(21 21)" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
          <circle cx="-7" cy="-6" r="2.4"/><circle cx="7" cy="-6" r="2.4"/><circle cx="0" cy="9" r="2.4"/>
          <path d="M-7 -6 L0 9 L7 -6 M-7 -6 L-4 4 M7 -6 L4 4"/>
        </g>
        <text x="54" y="26" fill="#475467">GitHub</text>
      </g>
      <!-- X -->
      <g transform="translate(216 100)">
        <rect x="0" y="0" width="42" height="42" rx="12" fill="#1f2937"/>
        <g transform="translate(21 21)" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>
        <text x="54" y="26" fill="#475467">X</text>
      </g>
      <!-- Instagram -->
      <g transform="translate(30 156)">
        <rect x="0" y="0" width="42" height="42" rx="12" fill="url(#gG)"/>
        <g transform="translate(21 21)" stroke="#fff" stroke-width="2.4" fill="none">
          <rect x="-11" y="-11" width="22" height="22" rx="6"/><circle cx="0" cy="0" r="6"/><circle cx="6" cy="-6" r="1.6" fill="#fff"/>
        </g>
        <text x="54" y="26" fill="#475467">Instagram</text>
      </g>
      <!-- YouTube -->
      <g transform="translate(216 156)">
        <rect x="0" y="0" width="42" height="42" rx="12" fill="#e0322f"/>
        <g transform="translate(21 21)" fill="#fff"><rect x="-12" y="-8" width="24" height="16" rx="5"/><path d="M-3 -4 L6 0 L-3 4 Z" fill="#e0322f"/></g>
        <text x="54" y="26" fill="#475467">YouTube</text>
      </g>
    </g>
  </g>
</svg>
