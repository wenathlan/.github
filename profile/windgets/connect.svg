<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="hC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#d4430c"/>
    </linearGradient>
    <filter id="shC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5a2a00" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="804" height="234" rx="24" fill="#ffffff" stroke="#eee2db" filter="url(#shC)"/>
  <rect x="8" y="8" width="6" height="234" rx="3" fill="url(#hC)"/>

  <g transform="translate(40 44)">
    <rect x="0" y="-2" width="170" height="38" rx="19" fill="url(#hC)"/>
    <text x="22" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">CONNECT</text>
  </g>

  <text x="40" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#475467">Let's build something. Reach out on any channel below.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(40 132)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#1f2937"/>
      <circle cx="24" cy="21" r="13" fill="#ffffff" opacity="0.12"/>
      <text x="48" y="26" fill="#ffffff">GitHub</text>
    </g>
    <g transform="translate(232 132)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#0b5cad"/>
      <text x="24" y="26" fill="#ffffff">LinkedIn</text>
    </g>
    <g transform="translate(394 132)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#d4430c"/>
      <text x="24" y="26" fill="#ffffff">X / Twitter</text>
    </g>
    <g transform="translate(556 132)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="#1f2937"/>
      <text x="24" y="26" fill="#ffffff">wenathlan@email.com</text>
    </g>
    <g transform="translate(40 184)">
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#eaf3fc" stroke="#cfe3f7"/>
      <text x="22" y="26" fill="#0b4a8a">YouTube</text>
    </g>
    <g transform="translate(212 184)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#fff1e8" stroke="#fcd9c2"/>
      <text x="22" y="26" fill="#9a3412">Instagram</text>
    </g>
    <g transform="translate(374 184)">
      <rect x="0" y="0" width="130" height="42" rx="21" fill="#eaf3fc" stroke="#cfe3f7"/>
      <text x="22" y="26" fill="#0b4a8a">Twitch</text>
    </g>
    <g transform="translate(516 184)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff1e8" stroke="#fcd9c2"/>
      <text x="22" y="26" fill="#9a3412">Bluesky</text>
    </g>
  </g>
</svg>
