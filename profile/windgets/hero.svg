<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="iNathlan — Solutions, Engineering, Ventures, Research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f2"/>
      <stop offset="0.55" stop-color="#fdf3ee"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#d4430c"/>
      <stop offset="1" stop-color="#0b5cad"/>
    </linearGradient>
    <linearGradient id="orbO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#d4430c"/>
    </linearGradient>
    <linearGradient id="orbB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#0b5cad"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1b2a4a" flood-opacity="0.10"/>
    </filter>
    <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="900" height="300" rx="32" fill="url(#bg)"/>

  <!-- decorative orbs -->
  <g filter="url(#orbBlur)" opacity="0.55">
    <circle cx="120" cy="70" r="70" fill="url(#orbO)"/>
    <circle cx="800" cy="240" r="90" fill="url(#orbB)"/>
    <circle cx="720" cy="60" r="34" fill="url(#orbO)" opacity="0.7"/>
  </g>

  <!-- grid lines -->
  <g stroke="#0b5cad" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="40" width="820" height="220" rx="24" fill="#ffffff" fill-opacity="0.82"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#brand)">iNathlan</text>

  <!-- tagline -->
  <text x="74" y="178" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="500" fill="#475467">Solutions · Engineering · Ventures · Research</text>

  <!-- pill chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="74" y="200" width="118" height="34" rx="17" fill="#fff1e8" stroke="#fcd9c2"/>
      <circle cx="93" cy="217" r="4" fill="#d4430c"/>
      <text x="106" y="221" fill="#9a3412">Audio AI</text>
    </g>
    <g>
      <rect x="206" y="200" width="120" height="34" rx="17" fill="#eaf3fc" stroke="#cfe3f7"/>
      <circle cx="225" cy="217" r="4" fill="#0b5cad"/>
      <text x="238" y="221" fill="#0b4a8a">Open Source</text>
    </g>
    <g>
      <rect x="340" y="200" width="98" height="34" rx="17" fill="#fff1e8" stroke="#fcd9c2"/>
      <circle cx="359" cy="217" r="4" fill="#fb923c"/>
      <text x="372" y="221" fill="#9a3412">Design</text>
    </g>
    <g>
      <rect x="452" y="200" width="118" height="34" rx="17" fill="#eaf3fc" stroke="#cfe3f7"/>
      <circle cx="471" cy="217" r="4" fill="#2563eb"/>
      <text x="484" y="221" fill="#0b4a8a">DevStack</text>
    </g>
  </g>

  <!-- spark -->
  <g transform="translate(796 96)" fill="none" stroke="#d4430c" stroke-width="3" stroke-linecap="round">
    <path d="M0 16 L16 0 L24 18 L10 14 Z" fill="url(#orbO)" stroke="none"/>
  </g>
</svg>
