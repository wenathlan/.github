<svg xmlns="http://www.w3.org/2000/svg" width="400" height="186" viewBox="0 0 400 186" role="img" aria-label="Languages">
  <defs>
    <linearGradient id="hL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#d4430c"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shL" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5a2a00" flood-opacity="0.10"/></filter>
    <clipPath id="cl"><rect x="6" y="6" width="388" height="174" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <rect x="6" y="6" width="388" height="174" rx="18" fill="#ffffff" stroke="#eee2db" filter="url(#shL)"/>
    <rect x="6" y="6" width="6" height="174" rx="3" fill="url(#hL)"/>
    <g transform="translate(30 28)">
      <rect x="0" y="-2" width="130" height="30" rx="15" fill="url(#hL)"/>
      <text x="16" y="18" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">LANGUAGES</text>
    </g>
    <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#1f2937">
      <g transform="translate(30 84)">
        <text x="0" y="0">TypeScript</text><text x="338" y="0" fill="#9a3412" text-anchor="end">42%</text>
        <rect x="0" y="10" width="338" height="7" rx="3.5" fill="#f0e6df"/>
        <rect x="0" y="10" height="7" rx="3.5" fill="url(#b1)"><animate attributeName="width" values="0;142;142" dur="1.4s" fill="freeze"/><animate attributeName="width" values="142;150;142" dur="3s" repeatCount="indefinite" begin="1.4s"/></rect>
      </g>
      <g transform="translate(30 122)">
        <text x="0" y="0">Rust</text><text x="338" y="0" fill="#0b4a8a" text-anchor="end">26%</text>
        <rect x="0" y="10" width="338" height="7" rx="3.5" fill="#e3eefa"/>
        <rect x="0" y="10" height="7" rx="3.5" fill="url(#b2)"><animate attributeName="width" values="0;88;88" dur="1.4s" begin="0.15s" fill="freeze"/><animate attributeName="width" values="88;94;88" dur="3.3s" repeatCount="indefinite" begin="1.55s"/></rect>
      </g>
      <g transform="translate(30 160)">
        <text x="0" y="0">Python</text><text x="338" y="0" fill="#9a3412" text-anchor="end">19%</text>
        <rect x="0" y="10" width="338" height="7" rx="3.5" fill="#f0e6df"/>
        <rect x="0" y="10" height="7" rx="3.5" fill="url(#b3)"><animate attributeName="width" values="0;64;64" dur="1.4s" begin="0.3s" fill="freeze"/><animate attributeName="width" values="64;70;64" dur="3.1s" repeatCount="indefinite" begin="1.7s"/></rect>
      </g>
    </g>
  </g>
