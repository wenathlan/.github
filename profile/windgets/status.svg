<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img">
  <defs>
    <linearGradient id="astatus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4430c"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <linearGradient id="bstatus" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#d4430c"/></linearGradient>
    <filter id="sstatus" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#5a2a00" flood-opacity="0.12"/></filter>
    <clipPath id="cl"><rect x="0" y="0" width="400" height="200" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <rect x="0" y="0" width="400" height="200" rx="20" fill="#ffffff" stroke="#f0e6df" filter="url(#sstatus)"/>
    <circle cx="376" cy="20" r="58" fill="url(#astatus)" opacity=".06"/>
    <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#astatus)"/>
    <g transform="translate(26 22)"><rect x="0" y="-2" width="75.6" height="26" rx="13" fill="url(#astatus)"/><text x="15" y="16" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.4">STATUS</text></g>
    <circle cx="34" cy="92" r="5" fill="#16a34a"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="50" y="96" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1f2937">Building in public</text>
    <circle cx="34" cy="120" r="5" fill="#16a34a"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="50" y="124" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1f2937">Open to collaborations</text>
    <circle cx="34" cy="148" r="5" fill="#d4430c"></circle>
    <text x="50" y="152" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1f2937">Ship · learn · repeat</text>
  </g>
