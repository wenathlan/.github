<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-label="Status">
  <defs>
    <linearGradient id="hB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#0b5cad"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6fafe"/>
    </linearGradient>
    <filter id="shB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b3a66" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="804" height="234" rx="24" fill="url(#cardB)" stroke="#e3eefa" filter="url(#shB)"/>
  <rect x="8" y="8" width="6" height="234" rx="3" fill="url(#hB)"/>

  <g transform="translate(40 44)">
    <rect x="0" y="-2" width="150" height="38" rx="19" fill="url(#hB)"/>
    <text x="22" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">STATUS</text>
  </g>

  <!-- live availability -->
  <g transform="translate(610 38)">
    <circle cx="12" cy="12" r="12" fill="#0b5cad" opacity="0.15"/>
    <circle cx="12" cy="12" r="6" fill="#0b5cad"/>
    <circle cx="12" cy="12" r="6" fill="none" stroke="#0b5cad" stroke-width="2">
      <animate attributeName="r" values="6;13;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="17" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b4a8a">Available for work</text>
  </g>

  <!-- status rows -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <g transform="translate(40 110)">
      <rect x="0" y="0" width="740" height="44" rx="12" fill="#fff1e8" stroke="#fcd9c2"/>
      <circle cx="22" cy="22" r="7" fill="#d4430c"/>
      <text x="44" y="27" font-size="15.5" font-weight="600" fill="#1f2937">Building</text>
      <text x="130" y="27" font-size="15.5" fill="#475467">real-time audio AI &amp; DSP pipelines</text>
    </g>
    <g transform="translate(40 166)">
      <rect x="0" y="0" width="740" height="44" rx="12" fill="#eaf3fc" stroke="#cfe3f7"/>
      <circle cx="22" cy="22" r="7" fill="#0b5cad"/>
      <text x="44" y="27" font-size="15.5" font-weight="600" fill="#1f2937">Learning</text>
      <text x="130" y="27" font-size="15.5" fill="#475467">Rust systems &amp; WASM edge inference</text>
    </g>
  </g>
</svg>
