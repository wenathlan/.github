<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img" aria-label="Status">
  <defs>
    <linearGradient id="hB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6fafe"/></linearGradient>
    <filter id="shB" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b3a66" flood-opacity="0.10"/></filter>
    <clipPath id="cs"><rect x="6" y="6" width="388" height="138" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cs)">
    <rect x="6" y="6" width="388" height="138" rx="18" fill="url(#cardB)" stroke="#e3eefa" filter="url(#shB)"/>
    <rect x="6" y="6" width="6" height="138" rx="3" fill="url(#hB)"/>
    <g transform="translate(30 28)">
      <rect x="0" y="-2" width="96" height="30" rx="15" fill="url(#hB)"/>
      <text x="16" y="18" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">STATUS</text>
    </g>
    <!-- live dot -->
    <g transform="translate(338 18)">
      <circle cx="10" cy="10" r="10" fill="#0b5cad" opacity="0.15"><animate attributeName="r" values="10;16;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.18;0;0.18" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="10" r="5" fill="#0b5cad"/>
    </g>
    <g transform="translate(30 72)" font-family="'Inter','Segoe UI',system-ui,sans-serif">
      <circle cx="6" cy="6" r="5" fill="#d4430c"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="22" y="11" font-size="13" font-weight="700" fill="#1f2937">Building</text>
      <text x="98" y="11" font-size="12.5" fill="#475467">audio AI &amp; DSP</text>
      <circle cx="6" cy="34" r="5" fill="#0b5cad"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="22" y="39" font-size="13" font-weight="700" fill="#1f2937">Learning</text>
      <text x="98" y="39" font-size="12.5" fill="#475467">Rust &amp; WASM</text>
    </g>
  </g>
</svg>
