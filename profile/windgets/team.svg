<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-label="Team">
  <defs>
    <linearGradient id="hT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#d4430c"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#0b5cad"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shT" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5a2a00" flood-opacity="0.10"/></filter>
    <clipPath id="ct"><rect x="6" y="6" width="388" height="168" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#ct)">
    <rect x="6" y="6" width="388" height="168" rx="18" fill="#ffffff" stroke="#eee2db" filter="url(#shT)"/>
    <rect x="6" y="6" width="6" height="168" rx="3" fill="url(#hT)"/>
    <g transform="translate(30 28)">
      <rect x="0" y="-2" width="90" height="30" rx="15" fill="url(#hT)"/>
      <text x="16" y="18" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">TEAM</text>
    </g>
    <text x="30" y="78" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" fill="#475467">Senior crew — eng, design &amp; research.</text>
    <g text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif">
      <g transform="translate(96 138)">
        <circle r="26" fill="url(#a1)"><animate attributeName="r" values="26;28;26" dur="3s" repeatCount="indefinite"/></circle>
        <text y="5" font-size="15" font-weight="800" fill="#fff">NB</text>
        <text y="46" font-size="11.5" font-weight="700" fill="#1f2937">Nathalan</text>
      </g>
      <g transform="translate(200 138)">
        <circle r="26" fill="url(#a2)"><animate attributeName="r" values="26;28;26" dur="3.4s" repeatCount="indefinite"/></circle>
        <text y="5" font-size="15" font-weight="800" fill="#fff">RD</text>
        <text y="46" font-size="11.5" font-weight="700" fill="#1f2937">R. Dias</text>
      </g>
      <g transform="translate(304 138)">
        <circle r="26" fill="url(#a3)"><animate attributeName="r" values="26;28;26" dur="3.8s" repeatCount="indefinite"/></circle>
        <text y="5" font-size="14" font-weight="800" fill="#fff">+U</text>
        <text y="46" font-size="11.5" font-weight="700" fill="#1f2937">You?</text>
      </g>
    </g>
  </g>
</svg>
