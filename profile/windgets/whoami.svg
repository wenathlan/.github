<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-label="Who we are">
  <defs>
    <linearGradient id="hO" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#d4430c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fffaf6"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7a2a00" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="804" height="304" rx="24" fill="url(#card)" stroke="#f0e6df" filter="url(#sh)"/>

  <!-- header -->
  <g transform="translate(40 44)">
    <rect x="0" y="-2" width="190" height="38" rx="19" fill="url(#hO)"/>
    <text x="22" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">WHO WE ARE</text>
  </g>

  <!-- illustration: stacked layers -->
  <g transform="translate(610 70)">
    <rect x="0" y="60" width="170" height="44" rx="12" fill="#eaf3fc" stroke="#cfe3f7"/>
    <rect x="14" y="36" width="142" height="44" rx="12" fill="#fff1e8" stroke="#fcd9c2"/>
    <rect x="28" y="12" width="114" height="44" rx="12" fill="url(#hO)"/>
    <circle cx="148" cy="34" r="9" fill="#0b5cad"/>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif" fill="#475467">
    <text x="40" y="128" font-size="18" font-weight="600" fill="#1f2937">We architect tomorrow's technology today.</text>
    <text x="40" y="166" font-size="15.5">iNathlan is a multidisciplinary studio operating at the</text>
    <text x="40" y="190" font-size="15.5">intersection of audio intelligence, open source and product</text>
    <text x="40" y="214" font-size="15.5">design — building tools, ventures and research that ship.</text>
    <text x="40" y="252" font-size="15.5">From low-level audio DSP to full-stack platforms, every</text>
    <text x="40" y="276" font-size="15.5">project is engineered with craft and a developer-first mindset.</text>
  </g>

  <!-- accent bar -->
  <rect x="8" y="8" width="6" height="304" rx="3" fill="url(#hO)"/>
</svg>
