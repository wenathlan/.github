<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img" aria-label="Who we are">
  <defs>
    <linearGradient id="hO" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#d4430c"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fffaf6"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7a2a00" flood-opacity="0.10"/></filter>
    <clipPath id="cw"><rect x="6" y="6" width="388" height="138" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cw)">
    <rect x="6" y="6" width="388" height="138" rx="18" fill="url(#card)" stroke="#f0e6df" filter="url(#sh)"/>
    <rect x="6" y="6" width="6" height="138" rx="3" fill="url(#hO)"/>
    <g transform="translate(30 28)">
      <rect x="0" y="-2" width="120" height="30" rx="15" fill="url(#hO)"/>
      <text x="16" y="18" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">WHO WE ARE</text>
    </g>
    <text x="30" y="80" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#1f2937">We build tomorrow's tech today.</text>
    <text x="30" y="104" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#475467">Studio across audio AI, open source</text>
    <text x="30" y="122" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#475467">&amp; product design — shipped.</text>
    <!-- animated mini-stack -->
    <g transform="translate(330 36)">
      <rect x="0" y="40" width="48" height="14" rx="5" fill="#eaf3fc"/>
      <rect x="6" y="26" width="36" height="14" rx="5" fill="#fff1e8"/>
      <rect x="12" y="12" width="24" height="14" rx="5" fill="url(#hO)">
        <animate attributeName="opacity" values="1;.6;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
